# Cookie для localhost спільні для всіх портів: браузер надсилає в phpMyAdmin і cookie сайту (:3000),
# і cookie інших локальних проєктів. Стандартного ліміту Apache (8 КБ на заголовок) буває замало —
# тоді «Size of a request header field exceeds server limit».
LimitRequestFieldSize 65536
LimitRequestLine 65536
